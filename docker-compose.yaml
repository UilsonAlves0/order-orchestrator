# Local: docker compose --env-file .env up --build
# CI:    docker compose --profile ci --env-file .env up --build --exit-code-from api-ci api-ci
# Test:  docker compose --profile test --env-file .env up --build api-test

services:
  mongo:
    image: mongo:8.2.6
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - boilerplate-mongo-db:/data/db
    ports:
      - ${DATABASE_PORT}:27017

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: ${DATABASE_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${DATABASE_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@mongo:${DATABASE_PORT}/

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379

  api:
    build:
      context: .
      dockerfile: document.Dockerfile
    ports:
      - ${APP_PORT}:${APP_PORT}
    depends_on:
      - mongo
      - redis

  api-ci:
    profiles: [ci]
    build:
      context: .
      dockerfile: document.e2e.Dockerfile
    env_file:
      - .env
    depends_on:
      - mongo
      - redis

  api-test:
    profiles: [test]
    build:
      context: .
      dockerfile: document.test.Dockerfile
    env_file:
      - .env
    volumes:
      - ./src:/usr/src/app/src
      - ./test:/usr/src/app/test
    depends_on:
      - mongo
      - redis

volumes:
  boilerplate-mongo-db:
